<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Writing Practice</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            500: '#0ea5e9',
                            600: '#0284c7',
                        },
                        discord: {
                            bg: '#36393f',
                            secondary: '#2f3136',
                            text: '#dcddde',
                            accent: '#5865F2',
                            accentHover: '#4752c4',
                            border: '#202225',
                            success: '#3ba55c' // Discord green
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        /* Custom scrollbar */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: transparent;
        }
        textarea::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 20px;
        }
        .dark textarea::-webkit-scrollbar-thumb {
            background-color: #1e1f22;
        }
        
        body {
            transition: background-color 0.2s ease, color 0.2s ease;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-discord-bg dark:text-discord-text h-screen flex flex-col font-sans selection:bg-brand-500 dark:selection:bg-discord-accent selection:text-white overflow-hidden">

    <!-- Unified Header/Toolbar -->
    <header class="bg-white dark:bg-discord-secondary shadow-sm border-b border-gray-200 dark:border-discord-border w-full z-10 shrink-0 h-14 flex items-center justify-between px-3 sm:px-6 transition-colors duration-200 relative">
        <!-- Left: Tabs -->
        <div class="flex space-x-1 sm:space-x-2">
            <button id="tab-task1" class="py-1.5 px-3 rounded-md bg-gray-200 dark:bg-discord-border shadow-inner text-sm font-semibold text-gray-900 dark:text-discord-text transition-all focus:outline-none">
                <span class="hidden sm:inline">Task 1</span><span class="sm:hidden">T1</span>
            </button>
            <button id="tab-task2" class="py-1.5 px-3 rounded-md text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-discord-border/60 text-sm font-medium transition-all focus:outline-none">
                <span class="hidden sm:inline">Task 2</span><span class="sm:hidden">T2</span>
            </button>
        </div>

        <!-- Center: Word Counter -->
        <div class="absolute left-1/2 transform -translate-x-1/2 flex items-center text-sm sm:text-base font-medium text-gray-600 dark:text-gray-400">
            <span class="hidden sm:inline mr-1">Words:</span>
            <span id="word-count-display" class="text-gray-900 dark:text-discord-text font-bold transition-colors">0</span>
            <span id="word-target-display" class="text-xs sm:text-sm font-normal opacity-70 ml-1">/ 150+</span>
        </div>
        
        <!-- Right: Actions -->
        <div class="flex items-center space-x-2">
            <button id="clear-btn" class="p-2 rounded-md bg-gray-100 hover:bg-gray-200 dark:bg-discord-bg dark:hover:bg-[#202225] text-gray-600 dark:text-gray-300 transition-colors focus:outline-none focus:ring-2 focus:ring-red-400" title="Clear Text">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
            </button>
            <button id="copy-btn" class="p-2 rounded-md bg-brand-500 hover:bg-brand-600 dark:bg-discord-accent dark:hover:bg-discord-accentHover text-white transition-colors focus:outline-none focus:ring-2 focus:ring-brand-500 dark:focus:ring-discord-accent" title="Copy Text">
                <svg id="copy-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
            </button>
            <!-- Proper Button for Theme Toggle -->
            <button id="theme-toggle" class="p-2 rounded-md bg-gray-200 hover:bg-gray-300 dark:bg-[#292b2f] dark:hover:bg-[#202225] text-gray-700 dark:text-yellow-400 border border-gray-300 dark:border-[#202225] transition-colors focus:outline-none focus:ring-2 focus:ring-brand-500 dark:focus:ring-discord-accent shadow-sm" title="Toggle Theme">
                <svg id="theme-toggle-light-icon" class="hidden w-5 h-5 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4.22 3.22a1 1 0 011.415 0l.708.708a1 1 0 01-1.414 1.414l-.708-.708a1 1 0 010-1.414zM18 10a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zm-3.22 4.22a1 1 0 010 1.415l-.708.708a1 1 0 01-1.414-1.414l.708-.708a1 1 0 011.414 0zM10 16a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zm-4.22-3.22a1 1 0 01-1.415 0l-.708-.708a1 1 0 011.414-1.414l.708.708a1 1 0 010 1.414zM2 10a1 1 0 011-1h1a1 1 0 110 2H3a1 1 0 01-1-1zm3.22-4.22a1 1 0 010-1.415l.708-.708a1 1 0 011.414 1.414l-.708.708a1 1 0 01-1.414 0zM10 6a4 4 0 100 8 4 4 0 000-8z" clip-rule="evenodd"></path>
                </svg>
                <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5 text-gray-700" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-grow w-full max-w-5xl mx-auto p-2 sm:p-4 flex flex-col">
        
        <!-- Task 1 Area -->
        <div id="container-task1" class="flex-grow flex flex-col relative rounded-xl border border-gray-200 dark:border-discord-border bg-white dark:bg-discord-secondary shadow-sm overflow-hidden focus-within:ring-2 focus-within:ring-brand-500 dark:focus-within:ring-discord-accent focus-within:border-transparent transition-all">
            <textarea 
                id="input-task1" 
                class="w-full h-full resize-none bg-transparent p-4 sm:p-6 text-gray-800 dark:text-discord-text placeholder-gray-400 dark:placeholder-gray-500 outline-none leading-relaxed text-base sm:text-lg focus:ring-0"
                placeholder="Start typing your Task 1 essay here..."
                spellcheck="false"
            ></textarea>
        </div>

        <!-- Task 2 Area -->
        <div id="container-task2" class="hidden flex-grow flex-col relative rounded-xl border border-gray-200 dark:border-discord-border bg-white dark:bg-discord-secondary shadow-sm overflow-hidden focus-within:ring-2 focus-within:ring-brand-500 dark:focus-within:ring-discord-accent focus-within:border-transparent transition-all">
            <textarea 
                id="input-task2" 
                class="w-full h-full resize-none bg-transparent p-4 sm:p-6 text-gray-800 dark:text-discord-text placeholder-gray-400 dark:placeholder-gray-500 outline-none leading-relaxed text-base sm:text-lg focus:ring-0"
                placeholder="Start typing your Task 2 essay here..."
                spellcheck="false"
            ></textarea>
        </div>
    </main>

    <!-- JavaScript Logic -->
    <script>
        // DOM Elements
        const themeToggleBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');
        
        const tab1 = document.getElementById('tab-task1');
        const tab2 = document.getElementById('tab-task2');
        const container1 = document.getElementById('container-task1');
        const container2 = document.getElementById('container-task2');
        const input1 = document.getElementById('input-task1');
        const input2 = document.getElementById('input-task2');
        
        const wordCountDisplay = document.getElementById('word-count-display');
        const wordTargetDisplay = document.getElementById('word-target-display');
        
        const copyBtn = document.getElementById('copy-btn');
        const copyIcon = document.getElementById('copy-icon');
        const clearBtn = document.getElementById('clear-btn');

        let activeTask = 1;
        let count1 = 0;
        let count2 = 0;

        // --- THEME LOGIC ---
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            lightIcon.classList.remove('hidden');
        } else {
            document.documentElement.classList.remove('dark');
            darkIcon.classList.remove('hidden');
        }

        themeToggleBtn.addEventListener('click', function() {
            darkIcon.classList.toggle('hidden');
            lightIcon.classList.toggle('hidden');
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            }
        });

        // --- TAB LOGIC ---
        function setActiveTab(task) {
            activeTask = task;
            const activeTabClass = "py-1.5 px-3 rounded-md bg-gray-200 dark:bg-discord-border shadow-inner text-sm font-semibold text-gray-900 dark:text-discord-text transition-all focus:outline-none";
            const inactiveTabClass = "py-1.5 px-3 rounded-md text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-discord-border/60 text-sm font-medium transition-all focus:outline-none";

            if (task === 1) {
                tab1.className = activeTabClass;
                tab2.className = inactiveTabClass;
                container1.classList.remove('hidden');
                container1.classList.add('flex');
                container2.classList.add('hidden');
                container2.classList.remove('flex');
                input1.focus();
            } else {
                tab2.className = activeTabClass;
                tab1.className = inactiveTabClass;
                container2.classList.remove('hidden');
                container2.classList.add('flex');
                container1.classList.add('hidden');
                container1.classList.remove('flex');
                input2.focus();
            }
            updateCounterDisplay();
        }

        tab1.addEventListener('click', () => setActiveTab(1));
        tab2.addEventListener('click', () => setActiveTab(2));

        // --- COUNTER LOGIC ---
        function updateCounterDisplay() {
            const currentCount = activeTask === 1 ? count1 : count2;
            const target = activeTask === 1 ? 150 : 250;
            
            wordCountDisplay.textContent = currentCount;
            wordTargetDisplay.textContent = `/ ${target}+`;
            
            if (currentCount >= target) {
                wordCountDisplay.classList.remove('text-gray-900', 'dark:text-discord-text');
                wordCountDisplay.classList.add('text-green-600', 'dark:text-discord-success');
            } else {
                wordCountDisplay.classList.remove('text-green-600', 'dark:text-discord-success');
                wordCountDisplay.classList.add('text-gray-900', 'dark:text-discord-text');
            }
        }

        function setupCounter(inputId, taskNumber) {
            const input = document.getElementById(inputId);
            
            input.addEventListener('input', () => {
                const words = input.value.trim().split(/\s+/).filter(w => w.length > 0);
                if (taskNumber === 1) {
                    count1 = words.length;
                } else {
                    count2 = words.length;
                }
                
                if (activeTask === taskNumber) {
                    updateCounterDisplay();
                }
            });
        }
        
        setupCounter('input-task1', 1);
        setupCounter('input-task2', 2);

        // --- COPY & CLEAR LOGIC ---
        function getActiveInput() {
            return activeTask === 1 ? input1 : input2;
        }

        copyBtn.addEventListener('click', async () => {
            const activeInput = getActiveInput();
            const textToCopy = activeInput.value;
            
            if (!textToCopy) return;

            try {
                await navigator.clipboard.writeText(textToCopy);
                showCopiedState();
            } catch (err) {
                const tempTextArea = document.createElement("textarea");
                tempTextArea.value = textToCopy;
                document.body.appendChild(tempTextArea);
                tempTextArea.select();
                try {
                    document.execCommand('copy');
                    showCopiedState();
                } catch (err) {
                    console.error('Failed to copy', err);
                }
                document.body.removeChild(tempTextArea);
            }
        });

        function showCopiedState() {
            const originalIcon = copyIcon.innerHTML;

            copyBtn.classList.remove('bg-brand-500', 'hover:bg-brand-600', 'dark:bg-discord-accent', 'dark:hover:bg-discord-accentHover');
            copyBtn.classList.add('bg-green-600', 'hover:bg-green-500', 'dark:bg-discord-success', 'dark:hover:bg-green-500');
            copyIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />`;

            setTimeout(() => {
                copyBtn.classList.remove('bg-green-600', 'hover:bg-green-500', 'dark:bg-discord-success', 'dark:hover:bg-green-500');
                copyBtn.classList.add('bg-brand-500', 'hover:bg-brand-600', 'dark:bg-discord-accent', 'dark:hover:bg-discord-accentHover');
                copyIcon.innerHTML = originalIcon;
            }, 2000);
        }

        clearBtn.addEventListener('click', () => {
            const activeInput = getActiveInput();
            if(activeInput.value.length > 0) {
                activeInput.value = '';
                // Trigger input event manually to reset counter
                activeInput.dispatchEvent(new Event('input'));
                activeInput.focus();
            }
        });

        // Initialize state
        setActiveTab(1);
    </script>
</body>
</html>
